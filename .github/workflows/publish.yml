name: Publish E2M site

on:
  push:
    branches:
      - main
      - quartz-site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Obsidian vault
        uses: actions/checkout@v4
        with:
          ref: main
          path: vault
          fetch-depth: 0

      - name: Check out Quartz site
        uses: actions/checkout@v4
        with:
          ref: quartz-site
          path: site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Quartz dependencies
        run: npm ci --registry=https://registry.npmjs.org
        working-directory: site

      - name: Connect vault content
        run: |
          mkdir -p site/content
          ln -s ../../vault site/content/e2m-vault

      - name: Build website
        run: node quartz/bootstrap-cli.mjs build -d content/e2m-vault
        working-directory: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
